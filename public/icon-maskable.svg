  <g fill="#f5f3ee">
    <rect x="55" y="106" width="22" height="34" rx="11" />
    <rect x="85" y="84" width="22" height="56" rx="11" />
    <rect x="115" y="52" width="22" height="88" rx="11" />
  </g>
</svg>
