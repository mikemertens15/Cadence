<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <meta
      name="description"
      content="Cadence — your classes, what's due, and where your grade actually stands."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Cadence</title>
    <script>
      // Pick light or dark before first paint, so opening the app at 1am never
      // flashes a white screen. Mirrors src/useTheme.js: a stored choice wins,
      // and the default ('system') follows the OS.
      (function () {
        var mode = 'light';
        try {
          var m = localStorage.getItem('cadence.mode') || 'system';
          mode =
            m === 'light' || m === 'dark'
              ? m
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch (e) {
          /* private browsing can throw on localStorage — stay with the default */
        }
        document.documentElement.dataset.mode = mode;
        // Status bar tint. The stylesheet may not have loaded this early, so
        // fall back to literals; useTheme re-reads the real value from the
        // stylesheet once React mounts and corrects any drift.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          var fromCss = getComputedStyle(document.documentElement)
            .getPropertyValue('--c-bg')
            .trim();
          meta.setAttribute('content', fromCss || (mode === 'dark' ? '#141614' : '#f5f3ee'));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
